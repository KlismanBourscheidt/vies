<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vies | Gestão Ocupacional</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:#192b40;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}aside{position:fixed;inset:0 auto 0 0;width:248px;background:#10233c;color:white;padding:26px 16px;display:flex;flex-direction:column}.brand{display:flex;gap:12px;align-items:center;padding:8px 12px 30px;font-size:25px;font-weight:800}.logo{background:#16b9ad;border-radius:13px;width:44px;height:44px;display:grid;place-items:center}.brand small{display:block;font-size:11px;color:#a8b9ce;font-weight:400;letter-spacing:.08em}nav{display:grid;gap:5px}.nav{border:0;background:transparent;color:#b7c7d9;text-align:left;padding:13px 15px;border-radius:10px;display:flex;gap:13px;align-items:center}.nav:hover,.nav.active{background:#1c3b59;color:white}.nav.active{box-shadow:inset 3px 0 #18c7b4}.sidebar-foot{margin-top:auto;color:#a9bdd0;font-size:12px;padding:15px;border-top:1px solid #30475e}main{margin-left:248px;min-height:100vh}.top{background:white;border-bottom:1px solid #e4ebf3;padding:20px 42px;display:flex;justify-content:space-between;align-items:center}.top .crumb{font-size:13px;color:#8291a5}.top .user{display:flex;gap:10px;align-items:center;color:#52667c;font-size:13px}.avatar{width:34px;height:34px;border-radius:50%;background:#d5f6f1;color:#067f78;display:grid;place-items:center;font-weight:800}.wrap{padding:36px 42px;max-width:1500px;margin:auto}.eyebrow{color:#0d9e98;text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:800}h1{font-size:31px;letter-spacing:-.04em;margin:7px 0}p.sub{color:#7d8ca0;margin:0 0 27px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px;margin-bottom:22px}.card,.panel{background:white;border:1px solid #e5ecf3;border-radius:15px;box-shadow:0 5px 24px #17345408}.card{padding:23px}.card .cap{color:#8090a2;font-size:13px}.card .num{font-size:30px;font-weight:800;margin:10px 0 5px}.card .hint{font-size:12px;color:#0b9f91}.card .ico{float:right;background:#e8faf7;color:#078e83;padding:8px;border-radius:9px}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:20px}.panel{padding:24px;margin-bottom:20px}.panel h2{font-size:17px;margin:0 0 6px}.muted{font-size:13px;color:#8190a4}.panel-head,.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}.btn{background:#12a99d;border:1px solid #12a99d;color:white;border-radius:9px;padding:10px 16px;font-size:13px;font-weight:700}.btn:hover{filter:brightness(.95)}.btn.secondary{background:white;color:#35536b;border-color:#dce6ef}.btn.danger{background:#fff4f3;color:#ba4a46;border-color:#ffdfdb}.btn.tiny{padding:7px 10px;font-size:12px}.table-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left}th{background:#f7f9fc;color:#8593a5;text-transform:uppercase;font-size:10px;letter-spacing:.08em}th,td{padding:15px 13px;border-bottom:1px solid #edf1f6;white-space:nowrap}td{font-size:13px}tr:last-child td{border-bottom:0}.pill{font-size:11px;border-radius:20px;padding:5px 9px;font-weight:700;background:#e6f7f1;color:#098a67}.pill.warn{background:#fff4dc;color:#a77816}.pill.off{background:#f0f1f4;color:#7d8797}.pill.high{background:#fff0ed;color:#bd4c39}.bars{display:flex;align-items:end;gap:17px;height:190px;padding:15px 5px 0;border-bottom:1px solid #e8edf4}.baritem{flex:1;text-align:center;font-size:11px;color:#8393a6}.bar{border-radius:7px 7px 0 0;background:linear-gradient(180deg,#20c5b7,#158c9e);margin:8px auto 0;max-width:54px;min-height:8px}.baritem strong{color:#30485f}.steps{display:grid;gap:16px}.step{display:flex;align-items:center;gap:12px}.step b{display:grid;place-items:center;border-radius:10px;background:#e9f8f6;color:#0b9589;width:36px;height:36px}.step strong{font-size:13px}.step small{display:block;color:#8795a5;margin-top:3px}.search{border:1px solid #dae5ef;padding:11px 13px;border-radius:9px;min-width:260px;max-width:100%;outline-color:#13b7a9}.empty{padding:36px;text-align:center;color:#8998aa}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px;color:#53687c;font-size:12px;font-weight:700}.field input,.field select,.field textarea{border:1px solid #dce5ef;border-radius:9px;padding:11px;background:white;color:#263a50;width:100%}.field.full{grid-column:1/-1}.field textarea{min-height:90px;resize:vertical}dialog{border:0;border-radius:17px;padding:0;width:min(620px,95vw);box-shadow:0 25px 90px #0a213855}dialog::backdrop{background:#0a213880}.modal-body{padding:26px}.modal-footer{display:flex;justify-content:flex-end;gap:9px;margin-top:24px}.toast{position:fixed;bottom:22px;right:22px;background:#153d43;color:white;padding:13px 20px;border-radius:10px;display:none;z-index:4}.mini-note{background:#f0faf8;border:1px solid #d8f1ec;border-radius:11px;padding:14px;color:#42756f;font-size:12px;margin-bottom:20px}.actionbar{display:flex;gap:6px}.title-line{display:flex;justify-content:space-between;align-items:center;gap:12px}.legend{display:flex;gap:15px;flex-wrap:wrap;color:#748599;font-size:12px;margin-top:16px}.dot{display:inline-block;width:9px;height:9px;background:#13a99d;border-radius:50%;margin-right:5px}.dot.yellow{background:#f4bd5b}.dot.red{background:#ec806b}@media(max-width:1050px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wrap{padding:24px}}@media(max-width:720px){aside{position:static;width:100%;padding:10px}.brand{padding:8px}.sidebar-foot{display:none}nav{display:flex;overflow-x:auto}.nav{white-space:nowrap;padding:10px}main{margin:0}.top{padding:14px 20px}.wrap{padding:22px 15px}.metrics{gap:10px}.card{padding:15px}.card .num{font-size:24px}.toolbar{flex-wrap:wrap}.search{width:100%}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<aside><div class="brand"><div class="logo">V</div><div>Vies<small>GESTÃO OCUPACIONAL</small></div></div><nav id="nav"></nav><div class="sidebar-foot"><span style="color:#16c6b3">●</span> Sistema operacional<br><span style="opacity:.65">Ambiente de protótipo</span></div></aside>
<main><header class="top"><div class="crumb">Vies / <span id="breadcrumb">Visão geral</span></div><div class="user"><span>Clínica Integrada</span><span class="avatar">CI</span></div></header><div class="wrap"><div class="eyebrow">Painel de gestão</div><h1 id="heading">Visão geral</h1><p class="sub" id="subtitle">Acompanhe os principais indicadores da operação.</p><div id="content"></div></div></main>
<dialog id="modal"><form id="record-form" class="modal-body"><div class="title-line"><h2 id="modal-title" style="margin:0 0 20px">Novo registro</h2><button type="button" class="btn secondary tiny" id="close">✕</button></div><div id="fields" class="form-grid"></div><div class="modal-footer"><button type="button" class="btn secondary" id="cancel">Cancelar</button><button type="submit" class="btn">Salvar registro</button></div></form></dialog><div class="toast" id="toast"></div>
<script>
'use strict';
// Dados exclusivamente fictícios; persistência local para a navegação demonstrativa.
const initial={
 vidas:[{id:1,nome:'Ana Martins',cpf:'***.***.***-21',empresa:'Aurora Indústria',cargo:'Operadora de produção',status:'Ativa'},{id:2,nome:'Bruno Oliveira',cpf:'***.***.***-32',empresa:'Horizonte Logística',cargo:'Motorista',status:'Ativa'},{id:3,nome:'Carla Souza',cpf:'***.***.***-43',empresa:'Aurora Indústria',cargo:'Assistente administrativa',status:'Ativa'},{id:4,nome:'Diego Santos',cpf:'***.***.***-54',empresa:'Vale Tecnologia',cargo:'Analista de suporte',status:'Ativa'},{id:5,nome:'Fernanda Lima',cpf:'***.***.***-65',empresa:'Horizonte Logística',cargo:'Auxiliar de estoque',status:'Ativa'},{id:6,nome:'Gabriel Costa',cpf:'***.***.***-76',empresa:'Vale Tecnologia',cargo:'Técnico de manutenção',status:'Inativa'}],
 riscos:[{id:1,empresa:'Aurora Indústria',setor:'Produção',atividade:'Operação de máquinas',grupo:'Físico',agente:'Ruído',nivel:'Alto',controle:'Protetor auditivo e avaliação ambiental'},{id:2,empresa:'Horizonte Logística',setor:'Expedição',atividade:'Movimentação de cargas',grupo:'Ergonômico',agente:'Levantamento manual de cargas',nivel:'Médio',controle:'Treinamento e auxílio mecânico'},{id:3,empresa:'Vale Tecnologia',setor:'Manutenção',atividade:'Manutenção elétrica',grupo:'Acidente',agente:'Eletricidade',nivel:'Alto',controle:'Bloqueio e etiquetagem; procedimentos NR-10'},{id:4,empresa:'Aurora Indústria',setor:'Limpeza',atividade:'Higienização',grupo:'Químico',agente:'Produtos de limpeza',nivel:'Baixo',controle:'FISPQ e luvas adequadas'}],
 documentos:[{id:1,nome:'PGR - Aurora Indústria',tipo:'PGR',validade:'2027-04-20',status:'Válido'},{id:2,nome:'PCMSO - Horizonte Logística',tipo:'PCMSO',validade:'2027-02-10',status:'Válido'},{id:3,nome:'ASO - Ana Martins',tipo:'ASO',validade:'2026-12-15',status:'A vencer'}],
 atividades:[{id:1,nome:'Avaliação de ruído',responsavel:'Segurança do Trabalho',data:'2026-11-24',status:'Planejada'},{id:2,nome:'Revisão de riscos ocupacionais',responsavel:'Equipe técnica',data:'2026-11-27',status:'Em andamento'}]
};
const menu=[['dashboard','▦','Visão geral','Acompanhe os principais indicadores da operação.'],['vidas','♙','Vidas','Consulte e gerencie os trabalhadores vinculados às empresas.'],['riscos','⚠','Riscos ocupacionais','Identifique perigos, avalie riscos e registre medidas de controle.'],['documentos','▤','Documentos','Acompanhe documentos ocupacionais e vencimentos.'],['atividades','▣','Planejamento','Organize atividades e responsáveis.'],['relatorios','◫','Relatórios','Visualize os indicadores consolidados da operação.']];
const schema={
 vidas:{columns:[['nome','Trabalhador'],['empresa','Empresa'],['cargo','Cargo'],['status','Situação']],fields:[['nome','Nome completo','text'],['cpf','CPF mascarado / identificador','text'],['empresa','Empresa','text'],['cargo','Cargo / função','text'],['status','Situação','select','Ativa|Inativa']]},
 riscos:{columns:[['empresa','Empresa'],['setor','Setor'],['grupo','Grupo de risco'],['agente','Agente / perigo'],['nivel','Nível'],['controle','Medidas de controle']],fields:[['empresa','Empresa','text'],['setor','Setor / GHE','text'],['atividade','Atividade exercida','text'],['grupo','Grupo de risco','select','Físico|Químico|Biológico|Ergonômico|Acidente'],['agente','Agente / perigo identificado','text'],['nivel','Classificação preliminar','select','Baixo|Médio|Alto'],['controle','Medidas de prevenção e controle','textarea']]},
 documentos:{columns:[['nome','Documento'],['tipo','Tipo'],['validade','Validade'],['status','Situação']],fields:[['nome','Nome do documento','text'],['tipo','Tipo','select','PGR|PCMSO|ASO|LTCAT|Outro'],['validade','Validade','date'],['status','Situação','select','Válido|A vencer|Vencido']]},
 atividades:{columns:[['nome','Atividade'],['responsavel','Responsável'],['data','Data'],['status','Situação']],fields:[['nome','Atividade','text'],['responsavel','Responsável','text'],['data','Data','date'],['status','Situação','select','Planejada|Em andamento|Concluída']]}
};
const KEY='vies-prototipo-v2';let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch{data=structuredClone(initial)};for(const k of Object.keys(initial))if(!Array.isArray(data[k]))data[k]=structuredClone(initial[k]);
let page='dashboard',filter='';const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const persist=()=>localStorage.setItem(KEY,JSON.stringify(data));const fmtDate=v=>v?new Date(v+'T12:00:00').toLocaleDateString('pt-BR'):'—';const active=()=>data.vidas.filter(v=>v.status==='Ativa').length;
function pill(v){let kind=/alto|vencido/i.test(v)?'high':/médio|vencer|andamento|planejada/i.test(v)?'warn':/inativa/i.test(v)?'off':'';return `<span class="pill ${kind}">${esc(v)}</span>`}
function notify(s){const t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2300)}
function metric(label,num,hint,icon){return `<article class="card"><span class="ico">${icon}</span><div class="cap">${label}</div><div class="num">${num}</div><div class="hint">${hint}</div></article>`}
function table(section,limit=Infinity,actions=true){const rows=data[section].filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(filter.toLowerCase()))).slice(0,limit);return `<div class="table-scroll"><table><thead><tr>${schema[section].columns.map(c=>`<th>${c[1]}</th>`).join('')}${actions?'<th>Ações</th>':''}</tr></thead><tbody>${rows.map(r=>`<tr>${schema[section].columns.map(([k])=>`<td>${['status','nivel'].includes(k)?pill(r[k]):['validade','data'].includes(k)?fmtDate(r[k]):esc(r[k])}</td>`).join('')}${actions?`<td><div class="actionbar"><button class="btn tiny secondary" data-edit="${section}:${r.id}">Editar</button><button class="btn tiny danger" data-delete="${section}:${r.id}">Excluir</button></div></td>`:''}</tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">Nenhum registro encontrado.</div>'}</div>`}
function dashboard(){const groups=['Físico','Químico','Biológico','Ergonômico','Acidente'];const counts=groups.map(g=>data.riscos.filter(r=>r.grupo===g).length);const max=Math.max(1,...counts);return `<div class="metrics">${metric('Vidas ativas',active(),'Trabalhadores em acompanhamento','♙')}${metric('Riscos identificados',data.riscos.length,'Registros no inventário','⚠')}${metric('Empresas atendidas',new Set(data.vidas.map(v=>v.empresa)).size,'Organizações cadastradas','▣')}${metric('Documentos',data.documentos.length,'Em acompanhamento','▤')}</div><div class="grid"><section class="panel"><div class="panel-head"><div><h2>Distribuição dos riscos</h2><span class="muted">Registros por grupo de risco ocupacional</span></div><button class="btn secondary tiny" data-go="riscos">Ver inventário</button></div><div class="bars">${groups.map((g,i)=>`<div class="baritem"><strong>${counts[i]}</strong><div class="bar" style="height:${Math.max(8,counts[i]/max*125)}px"></div><div>${g}</div></div>`).join('')}</div><div class="legend"><span><i class="dot"></i>Riscos registrados</span><span>Classificações ilustrativas</span></div></section><section class="panel"><h2>Fluxo de gestão</h2><p class="muted">Etapas da gestão ocupacional no Vies</p><div class="steps">${[['1','Cadastrar trabalhadores','Organizar vidas por empresa e função'],['2','Identificar riscos','Vincular setor, atividade e agente'],['3','Definir controles','Registrar medidas de prevenção'],['4','Acompanhar documentos','Monitorar prazos e atividades']].map(x=>`<div class="step"><b>${x[0]}</b><div><strong>${x[1]}</strong><small>${x[2]}</small></div></div>`).join('')}</div></section></div><section class="panel"><div class="panel-head"><div><h2>Vidas em acompanhamento</h2><span class="muted">Trabalhadores cadastrados</span></div><button class="btn secondary tiny" data-go="vidas">Ver todas</button></div>${table('vidas',5,false)}</section>`}
function listing(section){return `${section==='riscos'?'<div class="mini-note">O cadastro de riscos permite registrar empresa, setor/GHE, atividade, grupo, agente ou perigo, nível preliminar e medidas de controle. A avaliação técnica definitiva depende de critérios e profissionais habilitados.</div>':''}<section class="panel"><div class="toolbar"><input id="search" class="search" placeholder="Pesquisar por nome, empresa, setor..." value="${esc(filter)}" aria-label="Pesquisar registros"><button class="btn" data-add="${section}">+ ${section==='riscos'?'Incluir risco':section==='vidas'?'Cadastrar vida':'Novo registro'}</button></div><div id="records">${table(section)}</div></section>`}
function reports(){const byCompany={};data.vidas.filter(v=>v.status==='Ativa').forEach(v=>byCompany[v.empresa]=(byCompany[v.empresa]||0)+1);return `<div class="metrics">${metric('Vidas ativas',active(),'Em acompanhamento','♙')}${metric('Vidas inativas',data.vidas.length-active(),'Registros históricos','○')}${metric('Riscos altos',data.riscos.filter(r=>r.nivel==='Alto').length,'Classificação preliminar','⚠')}${metric('Medidas registradas',data.riscos.filter(r=>r.controle?.trim()).length,'Controles documentados','✓')}</div><div class="grid"><section class="panel"><div class="panel-head"><div><h2>Vidas ativas por empresa</h2><span class="muted">Distribuição dos trabalhadores ativos</span></div><button class="btn secondary tiny" id="export">Exportar CSV</button></div><div class="steps">${Object.entries(byCompany).map(([name,count])=>`<div class="step"><b>${count}</b><div><strong>${esc(name)}</strong><small>${count} ${count===1?'vida ativa':'vidas ativas'}</small></div></div>`).join('')}</div></section><section class="panel"><h2>Inventário de riscos</h2><p class="muted">Resumo dos níveis registrados</p><div class="steps">${['Baixo','Médio','Alto'].map(x=>`<div class="step"><b>${data.riscos.filter(r=>r.nivel===x).length}</b><div><strong>${x}</strong><small>Registros classificados</small></div></div>`).join('')}</div></section></div><button class="btn secondary" id="reset">Restaurar dados de exemplo</button>`}
function render(){const root=$('#content');root.innerHTML=page==='dashboard'?dashboard():page==='relatorios'?reports():listing(page);const search=$('#search');if(search)search.addEventListener('input',e=>{filter=e.target.value;$('#records').innerHTML=table(page)})}
function navigate(next){page=next;filter='';const s=menu.find(x=>x[0]===next);$('#heading').textContent=s[2];$('#breadcrumb').textContent=s[2];$('#subtitle').textContent=s[3];document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===next));render();window.scrollTo(0,0)}
function openForm(section,id){const existing=id===null?null:data[section].find(r=>r.id===id);$('#modal-title').textContent=existing?'Editar registro':section==='riscos'?'Incluir risco ocupacional':section==='vidas'?'Cadastrar vida':'Novo registro';$('#fields').innerHTML=schema[section].fields.map(([key,label,type,opts])=>`<label class="field ${type==='textarea'?'full':''}">${label}${type==='select'?`<select name="${key}" required>${opts.split('|').map(opt=>`<option ${existing?.[key]===opt?'selected':''}>${esc(opt)}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${key}" required>${esc(existing?.[key]||'')}</textarea>`:`<input name="${key}" type="${type}" value="${esc(existing?.[key]||'')}" required>`}</label>`).join('');$('#record-form').onsubmit=e=>{e.preventDefault();const values=Object.fromEntries(new FormData(e.currentTarget));if(existing)Object.assign(existing,values);else data[section].push({id:Math.max(0,...data[section].map(r=>r.id))+1,...values});persist();$('#modal').close();render();notify('Registro salvo com sucesso')};$('#modal').showModal()}
$('#nav').innerHTML=menu.map(s=>`<button class="nav" data-page="${s[0]}"><span style="font-size:18px">${s[1]}</span>${s[2]}</button>`).join('');$('#nav').onclick=e=>{const b=e.target.closest('[data-page]');if(b)navigate(b.dataset.page)};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go)navigate(b.dataset.go);if(b.dataset.add)openForm(b.dataset.add,null);if(b.dataset.edit){const [s,id]=b.dataset.edit.split(':');openForm(s,Number(id))}if(b.dataset.delete){const [s,id]=b.dataset.delete.split(':');if(confirm('Excluir este registro?')){data[s]=data[s].filter(x=>x.id!==Number(id));persist();render();notify('Registro excluído')}}if(b.id==='reset'&&confirm('Restaurar todos os dados fictícios?')){data=structuredClone(initial);persist();render();notify('Dados restaurados')}if(b.id==='export'){const rows=[['Empresa','Vidas ativas'],...Object.entries(data.vidas.filter(v=>v.status==='Ativa').reduce((a,v)=>(a[v.empresa]=(a[v.empresa]||0)+1,a),{}))];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='vies-vidas-ativas.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});$('#close').onclick=$('#cancel').onclick=()=>$('#modal').close();navigate('dashboard');
</script>
</body></html>
